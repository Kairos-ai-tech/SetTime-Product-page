name: i18n Key Parity Check

on:
  # No path filter: the check runs in well under a second, and a path
  # allowlist risks silently not running on a future refactor that moves
  # i18n data/markup/CSS without touching one of these exact filenames.
  pull_request: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-i18n-keys.js
